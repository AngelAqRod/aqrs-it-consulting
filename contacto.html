<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Contacto | AQRS IT Consulting
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="bg-slate-950 text-white">
    <!-- Navegación compartida generada con JavaScript. -->
    <div data-header>
    </div>
    <main>
      <!-- Encabezado de la página de contacto. -->
      <section class="page-hero pt-40 pb-20">
        <div class="mx-auto max-w-7xl px-5 lg:px-8">
          <p class="font-bold uppercase tracking-[.22em] text-cyan-300">
            Contacto
          </p>
          <h1 class="mt-4 max-w-3xl text-5xl font-black sm:text-6xl">
            Hablemos de lo que su empresa necesita.
          </h1>
        </div>
      </section>
      <!-- Datos de contacto, ubicación y formulario de consulta. -->
      <section class="bg-slate-50 py-20 text-slate-900">
        <div class="mx-auto grid max-w-7xl gap-10 px-5 lg:grid-cols-[.8fr_1.2fr] lg:px-8">
          <div>
            <h2 class="text-2xl font-black">
              Datos de contacto
            </h2>
            <div class="mt-6 space-y-4 text-slate-600">
              <p>
                <b class="block text-slate-900">
                  Correo
                </b>
                contacto@aqrsit.com
              </p>
              <p>
                <b class="block text-slate-900">
                  Teléfono
                </b>
                +502 0000-0000
              </p>
              <p>
                <b class="block text-slate-900">
                  Ubicación
                </b>
                Universidad Galileo, zona 10, Ciudad de Guatemala
              </p>
              <p>
                <b class="block text-slate-900">
                  Horario
                </b>
                Lunes a viernes, 8:00–17:00
              </p>
            </div>
            <!-- Mapa público de referencia para la ubicación académica. -->
            <div class="mt-8 overflow-hidden rounded-2xl border border-slate-300 bg-slate-200 shadow-sm">
              <iframe
                class="h-64 w-full"
                src="https://www.google.com/maps?q=Universidad+Galileo,+Zona+10,+Guatemala&amp;output=embed"
                title="Ubicación de Universidad Galileo, zona 10"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen>
              </iframe>
            </div>
          </div>
          <form data-demo class="rounded-3xl bg-white p-7 shadow-xl shadow-slate-200/60">
            <h2 class="text-2xl font-black">
              Solicite una asesoría
            </h2>
            <div class="mt-6 grid gap-5 sm:grid-cols-2">
              <label class="text-sm font-bold">
                Nombre
                <input required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal outline-none focus:border-blue-600" name="nombre">
              </label>
              <label class="text-sm font-bold">
                Empresa
                <input class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal outline-none focus:border-blue-600" name="empresa">
              </label>
              <label class="text-sm font-bold">
                Correo
                <input required type="email" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal outline-none focus:border-blue-600" name="correo">
              </label>
              <label class="text-sm font-bold">
                Teléfono
                <input class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal outline-none focus:border-blue-600" name="telefono">
              </label>
              <label class="text-sm font-bold sm:col-span-2">
                ¿Cómo podemos ayudarle?
                <textarea required rows="5" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal outline-none focus:border-blue-600" name="mensaje">
                </textarea>
              </label>
            </div>
            <button class="mt-5 rounded-xl bg-blue-600 px-6 py-3 font-black text-white hover:bg-blue-500">
              Enviar mensaje
            </button>
            <p data-message class="mt-4 text-sm font-semibold text-emerald-700" role="status">
            </p>
          </form>
        </div>
      </section>
    </main>
    <!-- Pie de página compartido generado con JavaScript. -->
    <div data-footer>
    </div>
    <script src="assets/js/main.js">
    </script>
  </body>
</html>
