<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Noticias y blog | AQRS
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="bg-slate-950 text-white">
    <!-- Navegación compartida generada con JavaScript. -->
    <div data-header>
    </div>
    <main>
      <!-- Encabezado de noticias y bitácora académica. -->
      <section class="page-hero pt-40 pb-20">
        <div class="mx-auto max-w-7xl px-5 lg:px-8">
          <p class="font-bold uppercase tracking-[.22em] text-cyan-300">
            Noticias y blog
          </p>
          <h1 class="mt-4 max-w-4xl text-5xl font-black sm:text-6xl">
            Una semana explorando la tecnología empresarial.
          </h1>
          <p class="mt-5 max-w-2xl text-slate-300">
          La bitácora académica de siete días se publicará en Blogger. Agregaremos aquí el enlace cuando esté disponible.
          </p>
        </div>
      </section>
      <!-- Estado del blog externo y publicaciones planificadas. -->
      <section class="bg-slate-50 py-20 text-slate-900">
        <div class="mx-auto max-w-7xl px-5 lg:px-8">
          <div class="mb-10 flex flex-col gap-5 border border-lime-300/30 bg-slate-950 p-6 text-white sm:flex-row sm:items-center sm:justify-between">
            <div>
              <p class="mono text-xs font-bold uppercase tracking-widest text-lime-300">
                Blog externo / Blogger
              </p>
              <p class="mt-2 text-sm text-slate-400">
                Enlace pendiente de creación y publicación.
              </p>
            </div>
            <span class="mono bg-amber-300 px-4 py-2 text-xs font-black uppercase text-slate-950">
              Pendiente
            </span>
          </div>
          <div data-posts class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
          </div>
        </div>
      </section>
    </main>
    <!-- Pie de página compartido generado con JavaScript. -->
    <div data-footer>
    </div>
    <script src="assets/js/main.js">
    </script>
  </body>
</html>
